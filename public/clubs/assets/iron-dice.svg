<!-- Text removed for the Next.js build: the card and page already print the
     club name, and several files carried placeholder titles (mana-wharf.svg
     said "Club Atlas"). Originals are untouched in ../app/clubs/assets. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Iron Dice Collective</title>
  <desc id="desc">Abstract wargaming club with terrain tables and hobby benches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132845"/>
      <stop offset="52%" stop-color="#1f548e"/>
      <stop offset="100%" stop-color="#7ec8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="116" y="168" width="968" height="392" rx="34" fill="#f8fbff"/>
  <rect x="190" y="236" width="274" height="252" rx="22" fill="#dcecff"/>
  <rect x="498" y="220" width="206" height="282" rx="22" fill="#174b8a"/>
  <rect x="736" y="236" width="274" height="252" rx="22" fill="#dcecff"/>
  <circle cx="602" cy="362" r="74" fill="#8bcbff"/>
  <circle cx="602" cy="362" r="38" fill="#f8fbff"/>
</svg>
